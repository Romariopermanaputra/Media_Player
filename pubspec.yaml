name: media_player
description: "Flutter Media Player - VLC-style player with media_kit"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.6
  file_picker: ^8.0.0
  permission_handler: ^11.3.0
  path_provider: ^2.1.0
  video_thumbnail: ^0.5.3
  shared_preferences: ^2.3.0
  provider: ^6.1.0
  sqflite: ^2.3.0
  path: ^1.9.0
  intl: ^0.19.0
  screen_brightness: ^2.1.9
  volume_controller: ^3.0.2
  wakelock_plus: ^1.2.0
  audio_service: ^0.18.18
  audio_session: ^0.2.3
  media_kit_libs_windows_video: ^1.0.11
  flutter_media_metadata: ^1.0.0+1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
